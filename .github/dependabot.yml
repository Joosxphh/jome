version: 2

updates:
  # npm — TypeScript / JavaScript / CSS (Tailwind, PostCSS, etc.)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
    groups:
      typescript:
        patterns:
          - "typescript"
          - "@typescript-eslint/*"
          - "ts-*"
      css-tooling:
        patterns:
          - "tailwindcss"
          - "postcss"
          - "autoprefixer"
          - "sass"
          - "stylelint*"
      testing:
        patterns:
          - "vitest"
          - "jest*"
          - "@testing-library/*"
          - "playwright"
      linting:
        patterns:
          - "eslint*"
          - "prettier*"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
